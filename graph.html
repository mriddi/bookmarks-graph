<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmarks Graph</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="graph.css">
</head>
<body>
<div id="bar">
  <input id="q" type="search" placeholder="Search title or URL…" autocomplete="off">
  <select id="section"><option value="">All sections</option></select>
  <span id="stats"></span>
  <button id="fit" title="Fit view" aria-label="Fit view"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
  <button id="gear" title="Layout settings">⚙</button>
</div>
<div id="panel" hidden>
  <div class="row check"><label><input id="showLinks" type="checkbox" checked> Link labels</label></div>
  <div class="row check"><label><input id="showRoot" type="checkbox" checked> Common “Bookmarks” root node</label></div>
  <div class="row theme"><label for="theme">Color scheme</label><button id="theme"></button></div>
  <div class="row"><label for="spread">Sparseness</label><span id="spreadVal">×1.00</span>
    <input id="spread" type="range" min="-4" max="4" step="0.05" value="0"><div class="hint">overall distance scale</div></div>
</div>
<canvas id="c"></canvas>
<div id="tip" hidden></div>
<script src="graph.js"></script>
</body>
</html>
